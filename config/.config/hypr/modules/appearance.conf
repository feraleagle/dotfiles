# ============================================================
# Appearance — General, Decoration, Animations, Layout
# ============================================================

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1

    col.active_border   = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing    = false
    layout           = dwindle
}

decoration {
    rounding       = 5
    rounding_power = 5
    active_opacity   = 1
    inactive_opacity = 1

    shadow {
        enabled      = true
        range        = 5
        render_power = 3
        color        = rgba(1a1a1aee)
    }

    blur {
        enabled   = true
        size      = 7
        passes    = 3
        vibrancy  = 0.9
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,   0.05,  0.05,   0.05,  0.05
    bezier = easeInOutCubic, 0.05,  0.05,   0.05,  0.05
    bezier = linear,            0,     0,   0.05,  0.05
    bezier = almostLinear,   0.05,  0.05,   0.05,  0.05
    bezier = quick,          0.05,  0.05,   0.05,  0.05

    animation = global,        1, 1,   default
    animation = border,        1, 1,   easeOutQuint
    animation = windows,       1, 1,   easeOutQuint
    animation = windowsIn,     1, 1,   easeOutQuint,    popin 77%
    animation = windowsOut,    1, 1,   linear,          popin 77%
    animation = fadeIn,        1, 1,   almostLinear
    animation = fadeOut,       1, 1,   almostLinear
    animation = fade,          1, 1,   quick
    animation = layers,        1, 1,   easeOutQuint
    animation = layersIn,      1, 1,   easeOutQuint,    fade
    animation = layersOut,     1, 1,   linear,          fade
    animation = fadeLayersIn,  1, 1,   almostLinear
    animation = fadeLayersOut, 1, 1,   almostLinear
    animation = workspaces,    1, 1,   easeOutQuint,    fade
    animation = workspacesIn,  1, 1,   easeInOutCubic,  fade
    animation = workspacesOut, 1, 1,   easeInOutCubic,  fade
    animation = zoomFactor,    1, 1,   quick
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo   = false
}

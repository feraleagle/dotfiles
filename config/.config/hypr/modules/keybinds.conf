# ============================================================
# Keybindings
# ============================================================
$mainMod  = ALT
$secMod = SUPER

$terminalEmulator       = kitty
$fileManager            = thunar
$tuiFileManager         = yazi
$webBrowser             = librewolf
$musicPlayer            = fooyin

# ── Core WM ────────────────────────────────────────────────
bind = $mainMod,       Q,     exec,          $terminalEmulator
bind = $mainMod,       E,     exec,          $fileManager
bind = $mainMod,       C,     killactive
bind = $mainMod,       V,     togglefloating
bind = $mainMod SHIFT, F,     fullscreen

# ── Focus Movement ─────────────────────────────────────────
bind = $mainMod SHIFT, h, movefocus, l
bind = $mainMod SHIFT, l, movefocus, r
bind = $mainMod SHIFT, k, movefocus, u
bind = $mainMod SHIFT, j, movefocus, d

# ── Workspaces ─────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

workspace = 1, defaultName:WEB,      persistent:true
workspace = 2, defaultName:TRM,      persistent:true
workspace = 3, defaultName:CODEX-C,  persistent:true
workspace = 4, defaultName:EXP,      persistent:true
workspace = 5, defaultName:MIS,      persistent:true

# ── Move Window to Workspace ───────────────────────────────
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ── Special Workspaces ─────────────────────────────────────
# General Purpose 
bind = $mainMod ,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, F1, movetoworkspace,        special:magic
# Music Workspace
bind = $mainMod ,       A, togglespecialworkspace, music
bind = $mainMod SHIFT, F2, movetoworkspace,        music

# ── Scroll Workspaces ──────────────────────────────────────
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up,   workspace, e+1

# ── Floating Terminal ──────────────────────────────────────
bind = $mainMod SHIFT, Q, exec, $terminalEmulator --class floating-term

# ── Window Move / Resize (Mouse) ───────────────────────────
bindm = $mainMod,       mouse:272, movewindow
bindm = $mainMod SHIFT, mouse:272, resizewindow

# ── App Shortcuts ──────────────────────────────────────────
bind = $mainMod,       B, exec, $webBrowser
bind = $mainMod SHIFT, A, exec, $musicPlayer
bind = $mainMod,       Y, exec, $terminalEmulator --class $terminalEmulator-$tuiFileManager -e $tuiFileManager

# ── Media Controls ($musicPlayer) ──────────────────────────
bindle = $secMod, Space, exec, playerctl -p $musicPlayer play-pause
bindle = $secMod, Left,  exec, playerctl -p $musicPlayer previous
bindle = $secMod, Right, exec, playerctl -p $musicPlayer next
bindle = $secMod, Up,    exec, playerctl -p $musicPlayer volume 0.03+
bindle = $secMod, Down,  exec, playerctl -p $musicPlayer volume 0.03-

# ── Noctalia-Shell ─────────────────────────────────────────
$ipc = qs -c noctalia-shell ipc call
bind = $mainMod, R,       exec, $ipc launcher toggle
bind = $mainMod SHIFT, X, exec, $ipc sessionMenu toggle
bind = $mainMod SHIFT, V, exec, $ipc plugin:clipboard toggle

bind = ,          PRINT, exec, $ipc plugin:screenshot takeScreenshot region
bind = $mainMod,  PRINT, exec, $ipc plugin:screenshot takeScreenshot window

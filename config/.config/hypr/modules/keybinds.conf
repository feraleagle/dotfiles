# ============================================================
# Keybindings
# ============================================================
$mainMod  = ALT
$secMod = SUPER

$terminalEmulator       = kitty
$fileManager            = thunar
$tuiFileManager         = yazi
$webBrowser             = librewolf
$musicPlayer            = fooyin

# ── Core WM ────────────────────────────────────────────────
bind = $mainMod,       Q,     exec,          $terminalEmulator
bind = $mainMod,       C,     killactive
bind = $mainMod,       F,     fullscreen
bind = $secMod,        V,     togglefloating

# ── Focus Movement ─────────────────────────────────────────
bind = $secMod , h, movefocus, l
bind = $secMod , l, movefocus, r
bind = $secMod , k, movefocus, u
bind = $secMod , j, movefocus, d

# ── Workspaces ─────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7

workspace = 1, defaultName:WEB,      persistent:true
workspace = 2, defaultName:TST,      persistent:true
workspace = 3, defaultName:CODEX-C,  persistent:true
workspace = 4, defaultName:EXP,      persistent:true
workspace = 5, defaultName:MSC,      persistent:true

# ── Move Window to Workspace ───────────────────────────────
bind = $secMod, 1, movetoworkspace, 1
bind = $secMod, 2, movetoworkspace, 2
bind = $secMod, 3, movetoworkspace, 3
bind = $secMod, 4, movetoworkspace, 4
bind = $secMod, 5, movetoworkspace, 5
bind = $secMod, 6, movetoworkspace, 6
bind = $secMod, 7, movetoworkspace, 7

# ── Special Workspaces ─────────────────────────────────────
bind = $mainMod ,       S, togglespecialworkspace, magic # Temporary
bind = $mainMod ,       A, togglespecialworkspace, music # Music

# ── Scroll Workspaces ──────────────────────────────────────
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up,   workspace, e+1

# ── Floating Terminal ──────────────────────────────────────
bind = $secMod, Q, exec, $terminalEmulator --class floating-term

# ── Window Move / Resize (Mouse) ───────────────────────────
bindm = $mainMod,       mouse:272, movewindow
bindm = $secMod,        mouse:272, resizewindow

# ── App Shortcuts ──────────────────────────────────────────
bind = $mainMod,       B, exec, $webBrowser
bind = $secMod,        A, exec, $musicPlayer
bind = $mainMod,       E, exec, $fileManager
bind = $mainMod,       Y, exec, $terminalEmulator --class tui-file-manager -e $tuiFileManager

# ── Media Controls ($musicPlayer) ──────────────────────────
bindle = , XF86AudioLowerVolume, exec, playerctl -p $musicPlayer volume 0.01-
bindle = , XF86AudioRaiseVolume, exec, playerctl -p $musicPlayer volume 0.01+

bindle = , XF86AudioPlay, exec, playerctl -p $musicPlayer  play-pause
bindle = , XF86AudioStop, exec, playerctl -p $musicPlayer  pause
bindle = , XF86AudioNext, exec, playerctl -p $musicPlayer  next
bindle = , XF86AudioPrev, exec, playerctl -p $musicPlayer  previous
bindle = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# ── Noctalia-Shell ─────────────────────────────────────────
$ipc = qs -c noctalia-shell ipc call
bind = $mainMod, R,       exec, $ipc launcher toggle
bind = $mainMod, V,       exec, $ipc plugin:clipboard toggle
bind = $secMod , X,       exec, $ipc sessionMenu toggle

bind = ,          PRINT, exec, $ipc plugin:screenshot takeScreenshot region
bind = $mainMod,  PRINT, exec, $ipc plugin:screenshot takeScreenshot window
